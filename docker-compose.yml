services:
  db:
    image: postgres:16-alpine
    container_name: railway-annotator-db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # POSTGRES_USER/PASSWORD/DB are deliberately NOT declared here as
      # ${VAR}-interpolated entries - see the backend volumes comment below
      # for why (Coolify doesn't feed its UI-configured vars into compose's
      # own substitution pass). For local dev they come from the env_file
      # above; under Coolify, set them directly in this service's own
      # Environment Variables tab. The backend service needs the *same*
      # values set independently on its own Coolify service config (see its
      # POSTGRES_* vars below) since each service's env is injected separately.
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, only against a brand-new empty data directory - see
      # db-init/001_create_mlflow_db.sql for what it does and the one-line
      # manual step needed against an already-initialized volume.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # No -U/-d flags: pg_isready just checks that the postmaster is
      # accepting connections, which doesn't require a valid role - keeps
      # this independent of whatever POSTGRES_USER ends up being.
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: automation-minio-1
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # MINIO_ROOT_USER/MINIO_ROOT_PASSWORD follow the same pattern as db's
    # POSTGRES_USER/PASSWORD - deliberately NOT declared under `environment:`
    # as ${VAR}-interpolated entries (Coolify doesn't feed its UI-configured
    # vars into compose's own substitution pass, see the backend volumes
    # comment below). They come from the env_file above for local dev; set
    # them directly in this service's own Coolify Environment Variables tab
    # in prod. Phase 5's dataset-snapshot staging store (see
    # annotation_module_build_plan.md Q-C) - not the pre-existing
    # vandebharat-minio-1 on this host, which belongs to a different project.
    command: server /data --console-address ":9001"
    ports:
      # Host ports deliberately different from the pre-existing
      # vandebharat-minio-1 (9010/9011) on this same host.
      - "9022:9000"
      - "9023:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: ./mlflow
    container_name: railway-annotator-mlflow
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # POSTGRES_HOST/PORT/DB are not secret, hardcoded like the backend
      # service does for the same values. POSTGRES_USER/PASSWORD are
      # deliberately absent here - see the `db`/`minio` services' own
      # comments on why: they come from the env_file for local dev and must
      # be set directly on this service's own Coolify Environment Variables
      # tab in prod, matching the `db` service's values exactly.
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - MLFLOW_BACKEND_DB=mlflow_tracking
      # MLflow's artifact store: same MinIO instance as the snapshot/golden
      # buckets, its own bucket. MLFLOW_S3_ENDPOINT_URL is boto3/MLflow's own
      # expected name for the endpoint, not secret. AWS_ACCESS_KEY_ID/SECRET
      # (also boto3's fixed names, not renamable) are deliberately absent
      # here for the same reason as POSTGRES_PASSWORD above - they must be
      # set to the *same values* as MINIO_ROOT_USER/PASSWORD, via the
      # env_file locally or Coolify's UI in prod.
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_ARTIFACT_ROOT=s3://mlflow-artifacts/
    ports:
      - "5050:5000"
    # The backend-store URI is built here, inside the container at start,
    # from container-runtime env vars - not with docker-compose's own
    # ${VAR} file-level substitution. This file's other services all avoid
    # ${POSTGRES_USER}/${PASSWORD}-style interpolation for exactly this
    # reason (see the `db`/`backend` services' comments): Coolify injects
    # its UI-configured vars into the running container but not into
    # compose's own substitution pass, so ${POSTGRES_USER} here would
    # silently resolve to empty in prod even though it works locally.
    entrypoint: ["sh", "-c"]
    command:
      - >
        mlflow server
        --backend-store-uri postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@$$POSTGRES_HOST:$$POSTGRES_PORT/$$MLFLOW_BACKEND_DB
        --default-artifact-root $$MLFLOW_ARTIFACT_ROOT
        --serve-artifacts
        --host 0.0.0.0
        --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: railway-annotator-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Not a hard dependency for the app to function - publishing a snapshot is
      # opt-in and a failure is reported rather than fatal (see
      # app/services/object_store.py) - but waiting avoids a spurious failure on
      # the first publish right after a cold `compose up`.
      minio:
        condition: service_healthy
      # Not a hard dependency for the app to function, same reasoning as
      # minio above: a training run's MLflow logging is wrapped to degrade
      # gracefully (report, don't fail the run) if the tracking server is
      # unreachable - see detector_service._run_training. Waiting just
      # avoids a spurious failure on the very first run right after a cold
      # `compose up`.
      mlflow:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    volumes:
      # Hardcoded absolute host paths rather than ${VAR}-interpolated ones:
      # Coolify injects its UI-configured env vars straight into the
      # container, but does not write them into a .env file for compose's
      # own variable-substitution pass, so ${DATASET_HOST_PATH} silently
      # fell back to its default and resolved relative to Coolify's managed
      # app directory instead of the real dataset. This is a single fixed
      # host deployment, so hardcoding is simplest and actually correct.
      - /home/omronix/Component/annotation_dataset:/data/dataset
      - /home/omronix/Component/annotation_tool/exports:/data/exports
      - /home/omronix/Component/annotation_tool/models:/data/models
      - logs_data:/app/logs
    environment:
      - DATASET_PATH=/data/dataset
      - EXPORTS_PATH=/data/exports
      - MODELS_PATH=/data/models
      - SAM_CHECKPOINT=/data/models/sam2.1_hiera_large.pt
      - SAM_MODEL_CFG=configs/sam2.1/sam2.1_hiera_l.yaml
      # POSTGRES_HOST/PORT are the compose service DNS name + default port -
      # not secret, safe to hardcode like the paths above. POSTGRES_USER/
      # PASSWORD/DB are NOT hardcoded here: they come from the env_file for
      # local dev, and must be set directly (matching the db service's own
      # values) in this service's Coolify Environment Variables tab in prod.
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # Dataset-snapshot staging store (M2). Endpoint/bucket/prefix are not
      # secret, so they're hardcoded here like the paths above; the endpoint is
      # the minio service's compose DNS name. S3_ACCESS_KEY/S3_SECRET_KEY are
      # deliberately NOT here - they come from the env_file for local dev and
      # must be set on this service's own Coolify Environment Variables tab in
      # prod, matching the minio service's MINIO_ROOT_USER/PASSWORD.
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=vb-dataset-snapshots
      - S3_PREFIX=snapshots
      # Scope A tracking (M5) - the in-tool SAM2/detector pre-labeler helper
      # only, never the pipeline team's own 8 production families (Q-C: we
      # stage data for them, we don't write into their MLflow). Not secret,
      # hardcoded like the paths above - it's the mlflow service's compose
      # DNS name.
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    # GPU passthrough via nvidia-container-toolkit; the backend image now installs
    # a CUDA-enabled (cu128) torch build with Blackwell (sm_121) kernels for this
    # host's GB10 GPU. sam_device=auto picks it up automatically when available.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    container_name: railway-annotator-frontend
    restart: unless-stopped
    depends_on:
      - backend

  review-dashboard:
    build:
      context: ./review_dashboard
    container_name: railway-review-dashboard
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      # Same exports host path as the backend service above - the dashboard
      # only needs read/write access to exports/class_folders.
      - /home/omronix/Component/annotation_tool/exports:/data/exports
    environment:
      - CLASS_FOLDERS_ROOT=/data/exports/class_folders
      # DASHBOARD_USERNAME / DASHBOARD_PASSWORD are deliberately NOT declared
      # here as ${VAR}-interpolated entries - see the backend volumes comment
      # above for why: Coolify injects its UI-configured env vars straight
      # into the container, not into a .env file compose reads for its own
      # substitution pass, so ${DASHBOARD_USERNAME} would silently resolve to
      # empty. Set them directly in Coolify's per-service Environment
      # Variables tab instead; app.py reads them from the container env at
      # runtime regardless of whether they're listed here.

volumes:
  logs_data:
  postgres_data:
  minio_data:
