services:
  backend:
    build:
      context: ./backend
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile.jetson}
    container_name: railway-annotator-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      # Paths are set via Dokploy Environment Variables tab (or .env file for
      # local dev). Defaults point to the AGX data location after dataset transfer.
      - ${DATASET_HOST_PATH:-/opt/annotation_dataset}:/data/dataset
      - ${EXPORTS_HOST_PATH:-/opt/annotation_tool/exports}:/data/exports
      - ${MODELS_HOST_PATH:-/opt/annotation_tool/models}:/data/models
      - logs_data:/app/logs
    environment:
      - DATASET_PATH=/data/dataset
      - EXPORTS_PATH=/data/exports
      - MODELS_PATH=/data/models
      - SAM_CHECKPOINT=/data/models/sam2.1_hiera_large.pt
      - SAM_MODEL_CFG=configs/sam2.1/sam2.1_hiera_l.yaml
    runtime: nvidia

  frontend:
    build:
      context: ./frontend
    container_name: railway-annotator-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  review-dashboard:
    build:
      context: ./review_dashboard
    container_name: railway-review-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8600}:8600"
    env_file:
      - path: .env
        required: false
    volumes:
      - ${EXPORTS_HOST_PATH:-/opt/annotation_tool/exports}:/data/exports
    environment:
      - CLASS_FOLDERS_ROOT=/data/exports/class_folders
      # Set DASHBOARD_USERNAME and DASHBOARD_PASSWORD in Dokploy's Environment
      # Variables tab — they are read from the container env at runtime.

volumes:
  logs_data:
